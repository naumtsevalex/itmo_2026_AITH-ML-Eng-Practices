stages:
  get_data:
    cmd: uv run --locked python -m src.get_data
    deps:
      - src/get_data.py
    outs:
      - data/raw/titanic.arff
  prepare:
    cmd: uv run --locked python -m src.prepare
    deps:
      - data/raw/titanic.arff
      - src/get_data.py
      - src/prepare.py
      - uv.lock
    outs:
      - data/prepared/titanic.csv
