[project]
name = "itmo-titanic"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = ["pandas>=2.2,<3", "scikit-learn>=1.6,<2"]

[dependency-groups]
dev = [
    "dvc>=3,<4",
    "mlflow>=3,<4",
    "pre-commit>=4,<5",
    "ruff>=0.15,<0.16",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
